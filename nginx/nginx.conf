events {
    worker_connections 1024;
}

http {
    upstream backend_cluster {
        # Resilient load-balanced upstream pool with passive health checking
        server backend-1:3001 max_fails=2 fail_timeout=5s;
        server backend-2:3001 max_fails=2 fail_timeout=5s;
        server backend-3:3001 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 80;
        server_name localhost;

        location / {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_header X-Backend-Instance;

            # High-Availability Failover Directives (Zero-Downtime Resilience)
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
            proxy_connect_timeout 1s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
        }
    }
}
