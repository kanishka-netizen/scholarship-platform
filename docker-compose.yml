services:
  backend-1:
    image: scholarship-backend:hardened
    container_name: scholarship-backend-1
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=3001
      - INSTANCE_NAME=backend-1
      - JWT_SECRET=da3-secure-jwt-secret-key-scholarship-2026
    ports:
      - "3001:3001"
    networks:
      - app-network

  backend-2:
    image: scholarship-backend:hardened
    container_name: scholarship-backend-2
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=3001
      - INSTANCE_NAME=backend-2
      - JWT_SECRET=da3-secure-jwt-secret-key-scholarship-2026
    ports:
      - "3002:3001"
    networks:
      - app-network

  backend-3:
    image: scholarship-backend:hardened
    container_name: scholarship-backend-3
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=3001
      - INSTANCE_NAME=backend-3
      - JWT_SECRET=da3-secure-jwt-secret-key-scholarship-2026
    ports:
      - "3003:3001"
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: scholarship-nginx-lb
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2
      - backend-3
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
